name: C++/Fortran build and tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y gfortran ninja-build
        python -m pip install --upgrade pip
        pip install --extra-index-url https://download.pytorch.org/whl/cpu torch==2.14.0+cpu
        pip install pyscf numpy
    - name: Build
      run: |
        TP=$(python -c 'import torch; print(torch.utils.cmake_prefix_path)')
        cmake -S . -B build-cmake -G Ninja -DCMAKE_PREFIX_PATH="$TP" -DNXC_TEST_PYTHON=$(which python)
        cmake --build build-cmake -j
    - name: Test
      run: ctest --test-dir build-cmake --output-on-failure
