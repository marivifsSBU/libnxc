name: pylibnxc and exporter tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --extra-index-url https://download.pytorch.org/whl/cpu torch==2.14.0+cpu
        pip install -e .[test,export]
    - name: pylibnxc tests
      run: cd pylibnxc/tests && python -m pytest -q -W ignore::FutureWarning .
    - name: exporter tests
      run: python -m pytest -q -W ignore::FutureWarning exporter/tests
